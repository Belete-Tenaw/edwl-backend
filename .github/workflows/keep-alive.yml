name: Render Keep-Alive

on:
  schedule:
    # Runs every 14 minutes to beat the 15-min idle spin-down
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s https://edwl-backend.onrender.com/health || echo "Ping failed"
          # Replace the URL above with your actual Render service URL
