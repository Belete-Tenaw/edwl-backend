<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/edwl_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#008080" />
  <meta name="description"
    content="EDWL - Ethio Domestic Workers Link. ኢትዮ የሃገር ውስጥ ሠራተኞች አገናኝ. Smart connections for a better home in Ethiopia." />
  <meta name="keywords"
    content="domestic workers, Ethiopia, Addis Ababa, house help, nannies, cleaners, ኢትዮጵያ, የቤት ሰራተኛ" />

  <meta name="google-site-verification" content="uZe1EwD2DZvYhRknPc54-VZxipS3l7auqNfOFqf8Z4E" />

  <!-- Open Graph / Facebook / Telegram -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://edwl-ethio-domesticworkerslink.web.app/" />
  <meta property="og:title" content="Ethio Domestic Workers Link | Smart Domestic Worker Search" />
  <meta property="og:description"
    content="Connect with verified domestic workers in Ethiopia. Secure, smart, and professional. የቤት ሰራተኞችን በቀላሉ ያግኙ።" />
  <meta property="og:image" content="https://edwl-ethio-domesticworkerslink.web.app/edwl_logo.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="Ethio Domestic Workers Link" />
  <meta property="twitter:description" content="Connecting Quality Help to Your Home in Ethiopia." />
  <meta property="twitter:image" content="https://edwl-ethio-domesticworkerslink.web.app/edwl_logo.png" />

  <title>Ethio Domestic Workers Link | Connecting Quality Help to Your Home</title>

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "EmploymentAgency",
    "name": "EDWL - Ethio Domestic Workers Link",
    "url": "https://edwl-ethio-domesticworkerslink.web.app/",
    "logo": "https://edwl-ethio-domesticworkerslink.web.app/edwl_logo.png",
    "description": "Smart connections for domestic workers and employers in Ethiopia. Hire nannies, cleaners, and house helpers safely.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Addis Ababa",
      "addressCountry": "ET"
    },
    "sameAs": [
      "https://t.me/edwl_ethio",
      "https://facebook.com/edwl.ethio"
    ],
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://edwl-ethio-domesticworkerslink.web.app/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Preconnect to external resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script>
    // Global Error Handler to show error on screen if blank
    window.onerror = function (message, source, lineno, colno, error) {
      const root = document.getElementById('root');
      if (root && root.innerHTML === "") {
        root.innerHTML = '<div style="padding: 20px; color: red; font-family: sans-serif;">' +
          '<h3>Application Startup Error</h3>' +
          '<p>' + (message || 'Unknown error occurred') + '</p>' +
          '<button onclick="window.location.reload(true)">Force Reload</button>' +
          '</div>';
      }
      return false;
    };
  </script>

  <style>
    /* Prevent FOUC (Flash of Unstyled Content) */
    body {
      margin: 0;
      background-color: #f8fafc;
    }

    #root:empty {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
