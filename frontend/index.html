<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icons/favicon/icon-32x32.svg" />
  <link rel="icon" type="image/svg+xml" sizes="16x16" href="/icons/favicon/icon-16x16.svg" />
  <link rel="icon" type="image/svg+xml" sizes="32x32" href="/icons/favicon/icon-32x32.svg" />
  <link rel="icon" type="image/svg+xml" sizes="48x48" href="/icons/favicon/icon-48x48.svg" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/pwa/icon-152x152.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#ff4500" />
  <meta name="description" content="Connect Ethiopian domestic workers with employers efficiently and securely" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EDWL" />

  <title>Ethio Domestic Workers Link (EDWL)</title>
</head>

<body>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('SW registered:', reg))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
