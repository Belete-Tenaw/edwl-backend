<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="64"/>
  
  <!-- Ethiopian flag accent stripe -->
  <rect x="0" y="456" width="512" height="18" fill="#009543"/>
  <rect x="0" y="474" width="512" height="20" fill="#FCDD09"/>
  <rect x="0" y="494" width="512" height="18" fill="#DA121A"/>
  
  <!-- Main EDWL text -->
  <text x="256" y="220" font-family="Arial, sans-serif" font-size="120" font-weight="bold" 
        fill="white" text-anchor="middle" filter="url(#shadow)">EDWL</text>
  
  <!-- Amharic subtitle -->
  <text x="256" y="280" font-family="Noto Sans Ethiopic, Arial" font-size="28" 
        fill="#E5E7EB" text-anchor="middle">ኢትዮ የሃገር ውስጥ</text>
  <text x="256" y="315" font-family="Noto Sans Ethiopic, Arial" font-size="28" 
        fill="#E5E7EB" text-anchor="middle">ሠራተኞች አገናኝ</text>
  
  <!-- Connecting icon element -->
  <circle cx="160" cy="380" r="18" fill="#FF4500" opacity="0.8"/>
  <circle cx="352" cy="380" r="18" fill="#FF4500" opacity="0.8"/>
  <line x1="178" y1="380" x2="334" y2="380" stroke="#FF4500" stroke-width="6" opacity="0.8"/>
</svg>
